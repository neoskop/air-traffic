name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests und Build
    # Xcode 27 gibt es bei GitHub nur auf diesem Image (macOS 27); macos-26 und macos-latest
    # bringen höchstens Xcode 26.x mit.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 27.2 wählen
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Tests und Build
        run: scripts/verify.sh
